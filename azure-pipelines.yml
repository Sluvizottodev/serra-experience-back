trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: BuildJob
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: |
              required_vars="DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET"
              for var in $required_vars; do
                if [ -z "${!var}" ]; then
                  echo "Missing required env var: $var"
                  exit 1
                fi
              done
            displayName: 'Validate environment variables'
            env:
              DATABASE_URL: $(DATABASE_URL)
              JWT_SECRET: $(JWT_SECRET)
              JWT_REFRESH_SECRET: $(JWT_REFRESH_SECRET)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx prisma generate
            displayName: 'Generate Prisma client'

          - script: npx prisma migrate deploy
            displayName: 'Run Prisma migrations'
            env:
              DATABASE_URL: $(DATABASE_URL)

          - script: npm run build
            displayName: 'Build TypeScript'

          - script: npm test
            displayName: 'Run tests'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'dist'
              ArtifactName: 'backend-dist'

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: 'viagem-motorista-api'
                    package: '$(Pipeline.Workspace)/backend-dist'
